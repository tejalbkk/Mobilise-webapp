<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Make your Mobilise Tap QR</title>
<style>
  :root{--grad:linear-gradient(135deg,#0B5FB0,#1C9DE0 45%,#12B5C9 72%,#8CC63F)}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#EEF6FC;color:#173649;display:flex;justify-content:center;padding:28px 16px}
  .card{max-width:440px;width:100%;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(11,95,176,.14);overflow:hidden}
  .top{background:var(--grad);color:#fff;padding:22px}
  .top h1{margin:0;font-size:22px}.top p{margin:6px 0 0;opacity:.95;font-size:14px}
  .body{padding:22px;text-align:center}
  input{width:100%;padding:14px;border:1.5px solid #e0ecf4;border-radius:12px;font-size:15px;margin:4px 0 14px}
  button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;
    background:#0A2A43;color:#fff}
  #qr{margin:22px auto 8px;display:flex;justify-content:center}
  .hint{font-size:13px;color:#66808f}
  a.dl{display:inline-block;margin-top:12px;color:#0B5FB0;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="top"><h1>Make your QR code</h1><p>Paste your live Vercel URL and print the QR for your stand or David's card.</p></div>
    <div class="body">
      <input id="url" placeholder="https://your-app.vercel.app" value="">
      <button onclick="make()">Generate QR</button>
      <div id="qr"></div>
      <div class="hint" id="hint">Tip: after you deploy, copy the URL from Vercel and paste it above.</div>
      <a class="dl" id="dl" style="display:none" download="mobilise-tap-qr.png">⬇ Download PNG</a>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // default to current origin so it "just works" once deployed
    document.getElementById('url').value = location.origin.startsWith('http') ? location.origin : '';
    function make(){
      var url=document.getElementById('url').value.trim();
      if(!url){document.getElementById('hint').textContent='Please paste a URL first.';return;}
      var box=document.getElementById('qr');box.innerHTML='';
      new QRCode(box,{text:url,width:240,height:240,colorDark:'#0A2A43',colorLight:'#ffffff'});
      setTimeout(function(){
        var img=box.querySelector('img')||box.querySelector('canvas');
        var dl=document.getElementById('dl');
        try{dl.href=(img.tagName==='IMG'?img.src:img.toDataURL('image/png'));dl.style.display='inline-block';}catch(e){}
        document.getElementById('hint').textContent='Scan it with a phone camera — it opens the donation app.';
      },250);
    }
    if(document.getElementById('url').value) make();
  </script>
</body>
</html>
